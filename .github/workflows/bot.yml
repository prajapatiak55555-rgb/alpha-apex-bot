name: Alpha Apex Bot Schedule

on:
  workflow_dispatch: # Manual Run Button active rakhta hai
  schedule:
    # Continuous Background Scan (Har 15 minute mein apne aap chalega)
    - cron: '*/15 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance

      - name: Execute Super Pro Max Engine
        run: python alpha_apex_bot.py
        
